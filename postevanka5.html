<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Igra Poštevanke - Natural Flow</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --grid-gap: 2px;
        }

        /* --- GLOBAL BASE --- */
        html, body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            /* Odstranjen overflow: hidden in 100dvh omejitve za naravni scroll */
            min-height: 100vh;
        }

        /* --- DESKTOP LAYOUT --- */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%; max-width: 1000px; padding: 10px 15px;
            display: flex; justify-content: center; z-index: 10;
        }
        
        .header-inner {
            width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }

        .timer-container {
            font-family: 'Courier New', monospace; font-size: 1.1rem; font-weight: bold;
            background: var(--surface); padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border);
        }

        .mode-container {
            display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2px;
        }
        .mode-btn {
            background: transparent; border: none; padding: 5px 10px; cursor: pointer; font-weight: 600; color: var(--text-light);
        }
        .mode-btn.active { background: var(--primary); color: white; border-radius: 6px; }
        
        button#start-btn {
            background: var(--primary); color: white; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 600;
        }

        /* Game Area */
        .game-container {
            display: flex; gap: 20px; padding: 20px; 
            align-items: flex-start; justify-content: center; 
            width: 100%;
            max-width: 1200px;
        }

        .grid-wrapper {
            background: var(--surface); padding: 15px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border);
        }

        /* Sidebar - Desktop Sticky */
        .sidebar {
            width: 120px; background: var(--surface); padding: 15px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border);
            text-align: center; position: sticky; top: 20px;
        }
        .sidebar h2 { margin: 0 0 10px 0; font-size: 1.1rem; }
        
        #numbers-container { display: flex; flex-direction: column; gap: 8px; }
        
        .number-option {
            background: white; border: 2px solid var(--border); padding: 10px; border-radius: 10px;
            font-size: 1.3rem; font-weight: 800; cursor: pointer; transition: 0.1s;
            display: flex; justify-content: center; align-items: center;
        }
        .number-option:hover { border-color: var(--secondary); color: var(--secondary); }
        .number-option.selected { background: var(--secondary); color: white; border-color: var(--secondary); }

        /* Grid */
        .multiplication-grid {
            display: grid;
            grid-template-columns: 30px repeat(10, 40px);
            grid-template-rows: 30px repeat(10, 40px);
            gap: 2px;
        }

        .cell {
            display: flex; justify-content: center; align-items: center;
            width: 100%; height: 100%; 
            background: #f1f5f9; border-radius: 4px;
            font-size: 0.9rem; color: var(--text-light); 
            cursor: default; user-select: none;
        }
        .cell.header { background: var(--primary); color: white; font-weight: bold; font-size: 0.8rem; }
        .cell.playable { cursor: pointer; background: #fff; border: 1px solid #e2e8f0; }
        .cell.playable:hover { background: #e0e7ff; }
        .cell.selected { background: #c7d2fe; border-color: var(--primary); font-weight: bold; transform: scale(0.95); }
        .cell.solved { background: var(--success); color: white; font-weight: bold; }
        .cell.inactive { background: #f8fafc; color: #e2e8f0; pointer-events: none; }


        /* --- MOBILE LAYOUT (< 768px) --- */
        @media (max-width: 768px) {
            body {
                /* Resetiramo na navaden flow (brez 100vh omejitev) */
                display: block; 
                padding-bottom: 20px;
            }

            header { 
                position: sticky; top: 0; 
                background: rgba(248, 250, 252, 0.95); backdrop-filter: blur(5px);
                box-shadow: 0 1px 5px rgba(0,0,0,0.05);
            }
            .header-inner { gap: 5px; justify-content: space-between; }
            .timer-container { font-size: 0.9rem; padding: 4px 6px; }
            .mode-btn { padding: 4px 6px; font-size: 0.8rem; }
            button#start-btn { padding: 4px 8px; font-size: 0.8rem; }

            .game-container {
                flex-direction: column;
                align-items: center;
                gap: 10px; /* Mali razmak med tabelo in gumbi */
                padding: 10px 0;
            }

            .grid-wrapper {
                padding: 0; background: transparent; border: none; box-shadow: none;
                width: 100%; max-width: 450px;
                display: flex; justify-content: center;
            }

            .multiplication-grid {
                /* Mobitel: Prilagodljiva širina */
                grid-template-columns: 20px repeat(10, 1fr);
                grid-template-rows: 20px repeat(10, auto);
                gap: 1px;
            }
            
            .cell { font-size: 0.7rem; border-radius: 2px; }
            .cell.playable, .cell.inactive, .cell.solved { aspect-ratio: 1; }
            .cell.header { font-size: 0.65rem; padding: 0; aspect-ratio: auto; }

            /* SIDEBAR - NATURAL FLOW + STICKY */
            .sidebar {
                width: 100%; 
                max-width: 600px; /* Da na tablicah ni preširoko */
                
                /* Tole je trik: Sticky Bottom */
                position: sticky; 
                bottom: 10px; /* Ustavi se 10px od dna */
                
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(5px);
                border: 1px solid var(--border);
                border-radius: 16px;
                box-shadow: 0 5px 20px rgba(0,0,0,0.1);
                
                padding: 8px; 
                margin-top: 5px; /* Malo prostora nad gumbi */
                z-index: 50;
                
                display: flex; justify-content: center;
            }
            .sidebar h2 { display: none; }
            
            #numbers-container { 
                flex-direction: row; gap: 6px; width: 100%; justify-content: center; 
            }
            
            .number-option { 
                width: 45px; height: 45px; padding: 0; font-size: 1.2rem; 
                flex: 0 0 auto; 
            }
        }

        @media (max-width: 380px) {
            .number-option { width: 38px; height: 38px; font-size: 1rem; }
            .sidebar { bottom: 5px; padding: 6px; }
        }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal {
            background: white; padding: 30px; border-radius: 20px;
            text-align: center; width: 85%; max-width: 350px;
        }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%,75%{transform:translateX(-5px)} 50%{transform:translateX(5px)} }
        .shake-screen { animation: shake 0.3s ease-in-out; }

    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="timer-container" id="timer">00:00.00</div>
            
            <div class="mode-container">
                <button class="mode-btn active" onclick="setMode('all', this)">VSE</button>
                <div class="divider"></div>
                <button class="mode-btn" onclick="setMode('top', this)">⬆</button>
                <button class="mode-btn" onclick="setMode('bottom', this)">⬇</button>
                <div class="divider"></div>
                <button class="mode-btn" onclick="setMode('q1', this)">1</button>
                <button class="mode-btn" onclick="setMode('q2', this)">2</button>
                <button class="mode-btn" onclick="setMode('q3', this)">3</button>
                <button class="mode-btn" onclick="setMode('q4', this)">4</button>
            </div>

            <button id="start-btn" onclick="startGame()">Nova</button>
        </div>
    </header>

    <div class="game-container">
        <div class="grid-wrapper">
            <div class="multiplication-grid" id="grid"></div>
        </div>
        
        <div class="sidebar">
            <h2>Števila</h2>
            <div id="numbers-container"></div>
        </div>
    </div>

    <div class="modal-overlay" id="win-modal">
        <div class="modal">
            <h2>Bravo!</h2>
            <p>Čas:<br><strong id="final-time" style="font-size: 2rem; color: var(--primary);">00:00.00</strong></p>
            <button id="start-btn-modal" onclick="startGame()" style="background: var(--success); color: white; border:none; padding: 15px 30px; border-radius: 8px; font-size: 1.2rem; cursor: pointer;">Igraj ponovno</button>
        </div>
    </div>

    <script>
        // --- GAME LOGIC (Brez JS layout fixov) ---
        let isGameRunning = false;
        let startTime = 0;
        let timerInterval;
        let selectedCell = null;
        let selectedNumberIdx = null;
        let gridData = []; 
        let currentHand = [];
        let currentMode = 'all'; 

        const gridEl = document.getElementById('grid');
        const numbersContainer = document.getElementById('numbers-container');
        const timerEl = document.getElementById('timer');
        const modal = document.getElementById('win-modal');

        function setMode(mode, btnEl) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            if(btnEl) btnEl.classList.add('active');
            startGame();
        }

        function getBounds() {
            let minR=1, maxR=10, minC=1, maxC=10;
            if (currentMode === 'top') { maxR = 5; }             
            else if (currentMode === 'bottom') { minR = 6; }     
            else if (currentMode === 'q1') { maxR=5; maxC=5; }   
            else if (currentMode === 'q2') { maxR=5; minC=6; }   
            else if (currentMode === 'q3') { minR=6; maxC=5; }   
            else if (currentMode === 'q4') { minR=6; minC=6; }   
            return { minR, maxR, minC, maxC };
        }

        function initGrid() {
            gridEl.innerHTML = '';
            const corner = document.createElement('div');
            corner.className = 'cell header';
            corner.innerText = '×';
            gridEl.appendChild(corner);

            for (let i = 1; i <= 10; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell header';
                cell.innerText = i;
                gridEl.appendChild(cell);
            }

            const { minR, maxR, minC, maxC } = getBounds();

            for (let r = 1; r <= 10; r++) {
                const rowHeader = document.createElement('div');
                rowHeader.className = 'cell header';
                rowHeader.innerText = r;
                gridEl.appendChild(rowHeader);

                for (let c = 1; c <= 10; c++) {
                    const cell = document.createElement('div');
                    const isActive = (r >= minR && r <= maxR && c >= minC && c <= maxC);
                    if (isActive) {
                        cell.className = 'cell playable';
                        cell.onclick = () => handleCellClick(r, c, cell);
                    } else {
                        cell.className = 'cell inactive';
                    }
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.innerText = `${r}×${c}`;
                    gridEl.appendChild(cell);
                }
            }
        }

        function startGame() {
            isGameRunning = true;
            gridData = Array(11).fill(null).map(() => Array(11).fill(false)); 
            currentHand = [];
            selectedCell = null;
            selectedNumberIdx = null;
            modal.classList.remove('active');
            initGrid();
            refillHand();
            startTimer();
        }

        function refillHand() {
            const { minR, maxR, minC, maxC } = getBounds();
            let emptySpots = [];
            for(let r=minR; r<=maxR; r++){
                for(let c=minC; c<=maxC; c++){
                    if(!gridData[r][c]) {
                        emptySpots.push({ r, c, val: r * c });
                    }
                }
            }
            emptySpots = emptySpots.filter(spot => {
                return !currentHand.some(handItem => handItem.r === spot.r && handItem.c === spot.c);
            });
            shuffleArray(emptySpots);
            while (currentHand.length < 5 && emptySpots.length > 0) {
                currentHand.push(emptySpots.pop());
            }
            renderSidebar();
        }

        function renderSidebar() {
            numbersContainer.innerHTML = '';
            currentHand.forEach((item, index) => {
                const btn = document.createElement('div');
                btn.className = 'number-option';
                if (index === selectedNumberIdx) btn.classList.add('selected');
                btn.innerText = item.val;
                btn.onclick = () => handleNumberClick(index);
                numbersContainer.appendChild(btn);
            });
        }

        function handleCellClick(r, c, cellEl) {
            if (!isGameRunning) return;
            if (gridData[r][c]) return; 
            const prev = document.querySelector('.cell.selected');
            if (prev) prev.classList.remove('selected');
            cellEl.classList.add('selected');
            selectedCell = { r, c, el: cellEl };
            if (selectedNumberIdx !== null) checkMatch();
        }

        function handleNumberClick(index) {
            if (!isGameRunning) return;
            selectedNumberIdx = index;
            renderSidebar(); 
            if (selectedCell) checkMatch();
        }

        function checkMatch() {
            const r = selectedCell.r;
            const c = selectedCell.c;
            const correctVal = r * c;
            const handItem = currentHand[selectedNumberIdx];
            if (correctVal === handItem.val) {
                handleCorrect(handItem);
            } else {
                handleWrong();
            }
        }

        function handleCorrect(handItem) {
            selectedCell.el.classList.remove('selected');
            selectedCell.el.classList.remove('playable');
            selectedCell.el.classList.add('solved');
            selectedCell.el.innerText = handItem.val;
            gridData[selectedCell.r][selectedCell.c] = true;
            currentHand.splice(selectedNumberIdx, 1);
            selectedCell = null;
            selectedNumberIdx = null;
            refillHand();
            checkWin();
        }

        function handleWrong() {
            document.body.classList.add('shake-screen');
            setTimeout(() => document.body.classList.remove('shake-screen'), 500);
            if(selectedCell) selectedCell.el.classList.remove('selected');
            selectedNumberIdx = null;
            selectedCell = null;
            renderSidebar();
        }

        function checkWin() {
            const { minR, maxR, minC, maxC } = getBounds();
            const totalCells = (maxR - minR + 1) * (maxC - minC + 1);
            let filled = 0;
            for(let r=minR; r<=maxR; r++) {
                for(let c=minC; c<=maxC; c++) {
                    if(gridData[r][c]) filled++;
                }
            }
            if(filled === totalCells) {
                stopTimer();
                isGameRunning = false;
                document.getElementById('final-time').innerText = timerEl.innerText;
                setTimeout(() => modal.classList.add('active'), 500);
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startTimer() {
            startTime = Date.now();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 30);
        }
        function stopTimer() { clearInterval(timerInterval); }
        function updateTimer() {
            const now = Date.now();
            const diff = now - startTime;
            const minutes = Math.floor(diff / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            const centis = Math.floor((diff % 1000) / 10);
            timerEl.innerText = `${pad(minutes)}:${pad(seconds)}.${pad(centis)}`;
        }
        function pad(num) { return num.toString().padStart(2, '0'); }

        startGame();
    </script>
</body>
</html>
