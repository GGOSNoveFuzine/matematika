<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Igra Poštevanke - Responsive Edition</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --inactive: #f1f5f9;
            --grid-gap: 3px;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 80px; /* Padding za mobile footer */
        }

        /* --- HEADER (Fleksibilen) --- */
        header {
            width: 100%;
            max-width: 1200px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .timer-container {
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            background: var(--surface);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        /* --- MODE SELECTOR (Scrollable on Mobile) --- */
        .mode-container {
            display: flex;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px;
            gap: 2px;
            
            /* Responsive Magic: na malih ekranih dovolimo scroll */
            overflow-x: auto;
            max-width: 100vw;
            -webkit-overflow-scrolling: touch; /* Smooth scroll na iOS */
            scrollbar-width: none; /* Skrij scrollbar firefox */
        }
        .mode-container::-webkit-scrollbar { display: none; /* Skrij scrollbar chrome */ }

        .divider {
            width: 1px;
            height: 24px;
            background-color: var(--border);
            margin: 0 4px;
            flex-shrink: 0; /* Da se ne stisne */
        }

        .mode-btn {
            background: transparent;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-light);
            white-space: nowrap; /* Da tekst ne gre v novo vrstico */
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 4px rgba(99, 102, 241, 0.3);
        }

        button#start-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* --- GAME LAYOUT --- */
        .game-container {
            display: flex;
            gap: 30px;
            padding: 10px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap; /* Ključno za responsive */
        }

        .grid-wrapper {
            background: var(--surface);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            /* Centriranje na mobile */
            display: flex;
            justify-content: center;
        }

        /* --- THE GRID (Responsive Math) --- */
        .multiplication-grid {
            display: grid;
            /* Na desktopu fiksno 45px, na mobitelu pa responsive (vw) */
            grid-template-columns: 35px repeat(10, 1fr);
            grid-template-rows: 35px repeat(10, 1fr);
            gap: var(--grid-gap);
        }

        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            /* Responsive size: Desktop 45px, Mobile pa kalkulirano */
            width: 45px; 
            height: 45px;
            background: #f1f5f9;
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text-light);
            cursor: default;
            user-select: none;
            border: 2px solid transparent;
        }

        .cell.header { background: var(--primary); color: white; font-weight: bold; font-size: 1rem; }
        .cell.playable { cursor: pointer; background: #fff; border: 1px solid #e2e8f0; }
        .cell.playable:hover { background: #e0e7ff; border-color: var(--primary); }
        
        .cell.selected {
            background: #c7d2fe; border-color: var(--primary);
            color: var(--primary-dark); font-weight: bold; transform: scale(0.95);
        }
        
        .cell.solved {
            background: var(--success); color: white;
            font-weight: bold; border-color: transparent;
        }
        
        .cell.inactive {
            background: #f8fafc; color: #e2e8f0; border: none;
        }

        /* --- SIDEBAR (Numbers) --- */
        .sidebar {
            width: 180px;
            background: var(--surface);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            text-align: center;
            
            /* Sticky behavior on desktop */
            position: sticky;
            top: 20px; 
        }

        #numbers-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .number-option {
            background: white;
            border: 2px solid var(--border);
            padding: 12px;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text);
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        .number-option.selected {
            background: var(--secondary); color: white; border-color: var(--secondary);
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
        }

        /* --- MOBILE BREAKPOINT (< 768px) --- */
        @media (max-width: 768px) {
            body {
                padding-bottom: 140px; /* Prostor za fixed spodnji bar */
            }

            header {
                justify-content: center;
                gap: 10px;
                padding: 10px;
            }

            .mode-container {
                width: 100%; /* Full width scroll */
                justify-content: flex-start; /* Start from left */
                padding: 8px;
            }

            /* Responsive Grid Sizing */
            .multiplication-grid {
                /* Na mobitelu izračunamo širino. 
                   Zaslon je 100vw. Odštejemo paddinge.
                   Delimo z 11.5 (11 celic + mali gapi). */
                grid-template-columns: 8vw repeat(10, 1fr);
                grid-template-rows: 8vw repeat(10, 1fr);
                gap: 2px;
            }

            .cell {
                /* Force square ratio based on width */
                width: auto;
                height: auto; 
                aspect-ratio: 1;
                font-size: 0.7rem; /* Manjša pisava */
                border-radius: 4px;
            }
            .cell.header { font-size: 0.8rem; }

            /* Grid wrapper margin reset */
            .grid-wrapper {
                padding: 5px;
                width: 98vw; /* Skoraj cel zaslon */
                border: none;
                background: transparent;
                box-shadow: none;
            }

            /* --- MOBILE HAND (Numbers at Bottom) --- */
            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: auto;
                border-radius: 20px 20px 0 0;
                z-index: 100;
                padding: 10px;
                box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
                display: flex;
                flex-direction: row; /* Horizontalno! */
                justify-content: space-between;
                align-items: center;
                gap: 10px;
            }

            .sidebar h2 {
                display: none; /* Skrij naslov "Števila" da prišparamo plac */
            }

            #numbers-container {
                flex-direction: row;
                width: 100%;
                justify-content: space-around;
            }

            .number-option {
                flex: 1; /* Enako široki */
                padding: 15px 5px; /* Večja touch area */
                font-size: 1.2rem;
                display: flex;
                justify-content: center;
                align-items: center;
            }
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal {
            background: white; padding: 30px; border-radius: 20px;
            text-align: center; width: 85%; max-width: 350px;
        }

        @keyframes shake { 0%,100%{transform:translateX(0)} 25%,75%{transform:translateX(-5px)} 50%{transform:translateX(5px)} }
        .shake-screen { animation: shake 0.3s ease-in-out; }

    </style>
</head>
<body>

    <header>
        <div class="timer-container" id="timer">00:00.00</div>
        
        <div class="mode-container">
            <button class="mode-btn active" onclick="setMode('all', this)">VSE</button>
            <div class="divider"></div>
            <button class="mode-btn" onclick="setMode('top', this)"><span>⬆</span> 1-5</button>
            <button class="mode-btn" onclick="setMode('bottom', this)"><span>⬇</span> 6-10</button>
            <div class="divider"></div>
            <button class="mode-btn" onclick="setMode('q1', this)">1</button>
            <button class="mode-btn" onclick="setMode('q2', this)">2</button>
            <button class="mode-btn" onclick="setMode('q3', this)">3</button>
            <button class="mode-btn" onclick="setMode('q4', this)">4</button>
        </div>

        <button id="start-btn" onclick="startGame()">Nova igra</button>
    </header>

    <div class="game-container">
        <div class="grid-wrapper">
            <div class="multiplication-grid" id="grid"></div>
        </div>

        <div class="sidebar">
            <h2>Števila</h2>
            <div id="numbers-container"></div>
        </div>
    </div>

    <div class="modal-overlay" id="win-modal">
        <div class="modal">
            <h2>Bravo!</h2>
            <p>Čas:<br><strong id="final-time" style="font-size: 2rem; color: var(--primary);">00:00.00</strong></p>
            <button id="start-btn-modal" onclick="startGame()" style="background: var(--success); color: white; border:none; padding: 15px 30px; border-radius: 8px; font-size: 1.2rem; cursor: pointer;">Igraj ponovno</button>
        </div>
    </div>

    <script>
        // --- Game State & Logic (Same as before, no changes needed to JS) ---
        let isGameRunning = false;
        let startTime = 0;
        let timerInterval;
        let selectedCell = null;
        let selectedNumberIdx = null;
        let gridData = []; 
        let currentHand = [];
        let currentMode = 'all'; 

        const gridEl = document.getElementById('grid');
        const numbersContainer = document.getElementById('numbers-container');
        const timerEl = document.getElementById('timer');
        const modal = document.getElementById('win-modal');
        const body = document.body;

        function setMode(mode, btnEl) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            if(btnEl) btnEl.classList.add('active');
            startGame();
        }

        function getBounds() {
            let minR=1, maxR=10, minC=1, maxC=10;
            if (currentMode === 'top') { maxR = 5; }             
            else if (currentMode === 'bottom') { minR = 6; }     
            else if (currentMode === 'q1') { maxR=5; maxC=5; }   
            else if (currentMode === 'q2') { maxR=5; minC=6; }   
            else if (currentMode === 'q3') { minR=6; maxC=5; }   
            else if (currentMode === 'q4') { minR=6; minC=6; }   
            return { minR, maxR, minC, maxC };
        }

        function initGrid() {
            gridEl.innerHTML = '';
            const corner = document.createElement('div');
            corner.className = 'cell header';
            corner.innerText = '×';
            gridEl.appendChild(corner);

            for (let i = 1; i <= 10; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell header';
                cell.innerText = i;
                gridEl.appendChild(cell);
            }

            const { minR, maxR, minC, maxC } = getBounds();

            for (let r = 1; r <= 10; r++) {
                const rowHeader = document.createElement('div');
                rowHeader.className = 'cell header';
                rowHeader.innerText = r;
                gridEl.appendChild(rowHeader);

                for (let c = 1; c <= 10; c++) {
                    const cell = document.createElement('div');
                    const isActive = (r >= minR && r <= maxR && c >= minC && c <= maxC);
                    
                    if (isActive) {
                        cell.className = 'cell playable';
                        cell.onclick = () => handleCellClick(r, c, cell);
                    } else {
                        cell.className = 'cell inactive';
                    }
                    
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.innerText = `${r}×${c}`; // Na mobitelu bo font size to skril/pomanjšal
                    gridEl.appendChild(cell);
                }
            }
        }

        function startGame() {
            isGameRunning = true;
            gridData = Array(11).fill(null).map(() => Array(11).fill(false)); 
            currentHand = [];
            selectedCell = null;
            selectedNumberIdx = null;
            modal.classList.remove('active');
            initGrid();
            refillHand();
            startTimer();
        }

        function refillHand() {
            const { minR, maxR, minC, maxC } = getBounds();
            let emptySpots = [];
            for(let r=minR; r<=maxR; r++){
                for(let c=minC; c<=maxC; c++){
                    if(!gridData[r][c]) {
                        emptySpots.push({ r, c, val: r * c });
                    }
                }
            }
            emptySpots = emptySpots.filter(spot => {
                return !currentHand.some(handItem => handItem.r === spot.r && handItem.c === spot.c);
            });
            shuffleArray(emptySpots);
            while (currentHand.length < 5 && emptySpots.length > 0) {
                currentHand.push(emptySpots.pop());
            }
            renderSidebar();
        }

        function renderSidebar() {
            numbersContainer.innerHTML = '';
            currentHand.forEach((item, index) => {
                const btn = document.createElement('div');
                btn.className = 'number-option';
                if (index === selectedNumberIdx) btn.classList.add('selected');
                btn.innerText = item.val;
                btn.onclick = () => handleNumberClick(index);
                numbersContainer.appendChild(btn);
            });
        }

        function handleCellClick(r, c, cellEl) {
            if (!isGameRunning) return;
            if (gridData[r][c]) return; 
            const prev = document.querySelector('.cell.selected');
            if (prev) prev.classList.remove('selected');
            cellEl.classList.add('selected');
            selectedCell = { r, c, el: cellEl };
            if (selectedNumberIdx !== null) checkMatch();
        }

        function handleNumberClick(index) {
            if (!isGameRunning) return;
            selectedNumberIdx = index;
            renderSidebar(); 
            if (selectedCell) checkMatch();
        }

        function checkMatch() {
            const r = selectedCell.r;
            const c = selectedCell.c;
            const correctVal = r * c;
            const handItem = currentHand[selectedNumberIdx];
            if (correctVal === handItem.val) {
                handleCorrect(handItem);
            } else {
                handleWrong();
            }
        }

        function handleCorrect(handItem) {
            selectedCell.el.classList.remove('selected');
            selectedCell.el.classList.remove('playable');
            selectedCell.el.classList.add('solved');
            selectedCell.el.innerText = handItem.val;
            gridData[selectedCell.r][selectedCell.c] = true;
            currentHand.splice(selectedNumberIdx, 1);
            selectedCell = null;
            selectedNumberIdx = null;
            refillHand();
            checkWin();
        }

        function handleWrong() {
            body.classList.add('shake-screen');
            setTimeout(() => body.classList.remove('shake-screen'), 500);
            if(selectedCell) selectedCell.el.classList.remove('selected');
            selectedNumberIdx = null;
            selectedCell = null;
            renderSidebar();
        }

        function checkWin() {
            const { minR, maxR, minC, maxC } = getBounds();
            const totalCells = (maxR - minR + 1) * (maxC - minC + 1);
            let filled = 0;
            for(let r=minR; r<=maxR; r++) {
                for(let c=minC; c<=maxC; c++) {
                    if(gridData[r][c]) filled++;
                }
            }
            if(filled === totalCells) {
                stopTimer();
                isGameRunning = false;
                document.getElementById('final-time').innerText = timerEl.innerText;
                setTimeout(() => modal.classList.add('active'), 500);
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startTimer() {
            startTime = Date.now();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 30);
        }
        function stopTimer() { clearInterval(timerInterval); }
        function updateTimer() {
            const now = Date.now();
            const diff = now - startTime;
            const minutes = Math.floor(diff / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            const centis = Math.floor((diff % 1000) / 10);
            timerEl.innerText = `${pad(minutes)}:${pad(seconds)}.${pad(centis)}`;
        }
        function pad(num) { return num.toString().padStart(2, '0'); }

        startGame();
    </script>
</body>
</html>
